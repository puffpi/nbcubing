name: Daily WCA Data Update

on:
  schedule:
    # 每天 UTC 时间 19:00 执行（对应北京时间凌晨 3:00）
    - cron: '0 19 * * *'
  workflow_dispatch: # 允许在 Actions 面板手动点击按钮运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run data fetch script
        run: python update_data.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add wca_data.json
          # 如果数据有更新则提交，没有更新则跳过
          git commit -m "Auto-update WCA data [skip ci]" || echo "No changes to commit"
          git push
