name: Auto Update WCA Database

on:
  schedule:
    # 每天 UTC 时间 20:00 (北京时间凌晨 4:00) 自动执行
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行数据更新脚本
        run: python update_data.py

      - name: 提交并推送到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wca_data.json history_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update WCA data" && git push)
