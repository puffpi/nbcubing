name: Auto Update WCA Database

on:
  schedule:
    # 每天 UTC 时间凌晨 2 点（北京时间上午 10 点）自动执行
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装运行依赖
        run: pip install -r requirements.txt

      - name: 执行 WCA 数据拉取与解析脚本
        run: python update_wca.py

      - name: 提交更新的 JSON 文件
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wca_data.json history_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update WCA data" && git push)
