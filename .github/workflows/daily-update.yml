name: Auto Update WCA Database

on:
  schedule:
    # 每天 UTC 20:00
    # = 北京时间 04:00
    - cron: '0 20 * * *'

  # 允许在 GitHub Actions 页面手动执行
  workflow_dispatch:

# 防止同一个 workflow 同时运行多个版本
concurrency:
  group: wca-database-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 45

    steps:

      # ======================================================
      # 1. 获取仓库代码
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ======================================================
      # 2. 安装 Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ======================================================
      # 3. 安装 Python 依赖
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ======================================================
      # 4. 更新 WCA 数据
      # ======================================================

      - name: Fetch and process WCA data
        run: |
          python update_data.py

      # ======================================================
      # 5. 检查生成结果
      # ======================================================

      - name: Verify generated files
        run: |
          echo "Checking generated files..."

          test -f wca_data.json
          test -f history_data.json

          echo "wca_data.json:"
          ls -lh wca_data.json

          echo "history_data.json:"
          ls -lh history_data.json

          echo "JSON validation:"
          python -m json.tool wca_data.json > /dev/null
          python -m json.tool history_data.json > /dev/null

          echo "Generated JSON files are valid."

      # ======================================================
      # 6. 提交更新后的 JSON
      # ======================================================

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 只提交网站真正需要的两个数据文件
          git add wca_data.json history_data.json

          # 没有变化就正常退出
          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          git commit -m "chore: auto update WCA database"

          git push
